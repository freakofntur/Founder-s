<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electron Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Navigation Toolbar -->
    <div class="toolbar">
      <button id="back-btn" class="nav-btn" title="Go back">← Back</button>
      <button id="forward-btn" class="nav-btn" title="Go forward">Forward →</button>
      <button id="refresh-btn" class="nav-btn" title="Refresh page">🔄 Refresh</button>
    </div>

    <!-- Address Bar -->
    <div class="address-bar">
      <input 
        type="text" 
        id="url-input" 
        class="url-input" 
        placeholder="Enter URL or search query..."
        value="https://www.google.com"
      />
      <button id="go-btn" class="go-btn">Go</button>
    </div>

    <!-- Webview for displaying websites -->
    <webview id="browser" class="webview" src="https://www.google.com"></webview>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
