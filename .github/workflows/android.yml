name: Android build

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

# Publishing the "nightly" release needs write access to the repo's releases.
permissions:
  contents: write

# A newer push supersedes an in-flight build instead of queueing behind it.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The Firefox checkout, SDK and Gradle caches need more room than the runner has free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.mozbuild
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: foundry-${{ hashFiles('android/FIREFOX_REVISION') }}
          restore-keys: foundry-

      - name: Fetch Firefox source
        run: android/scripts/fetch.sh

      - name: Apply Foundry patches
        run: android/scripts/apply.sh

      # Every build is signed with the same key, so a new APK installs over the previous one.
      - name: Install Foundry's debug signing key
        run: mkdir -p ~/.android && cp android/signing/foundry-debug.keystore ~/.android/debug.keystore

      - name: Build
        run: android/scripts/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foundry-debug-apk
          path: android/firefox/objdir-foundry/gradle/build/mobile/android/fenix/app/outputs/apk/**/*.apk
          if-no-files-found: error

      # One stable link for phones: always the latest build, a plain APK, no login or unzip needed.
      - name: Publish to the "nightly" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find android/firefox/objdir-foundry/gradle/build/mobile/android/fenix/app/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          cp "$apk" foundry-arm64.apk
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --target "$GITHUB_SHA" --title "Foundry nightly" \
              --notes "Latest Foundry debug build for 64-bit Android phones. Download foundry-arm64.apk and install it."
          gh release upload nightly foundry-arm64.apk --clobber
