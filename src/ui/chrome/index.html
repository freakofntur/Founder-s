<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self'; script-src 'self'"
    />
    <title>Founder</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <header id="chrome">
      <div id="tabstrip">
        <div id="tabs" role="tablist"></div>
        <button id="new-tab" class="icon-btn" title="New tab (Ctrl+T)" aria-label="New tab">
          <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg>
        </button>
      </div>

      <div id="toolbar">
        <button id="back" class="icon-btn" title="Back (Alt+Left)" aria-label="Back">
          <svg viewBox="0 0 16 16"><path d="M13 8H3m4-4L3 8l4 4" /></svg>
        </button>
        <button id="forward" class="icon-btn" title="Forward (Alt+Right)" aria-label="Forward">
          <svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4" /></svg>
        </button>
        <button id="reload" class="icon-btn" title="Reload (Ctrl+R)" aria-label="Reload">
          <svg class="when-idle" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5V5h-2.5" /></svg>
          <svg class="when-loading" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" /></svg>
        </button>

        <div id="address">
          <svg class="address-icon" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" /></svg>
          <input
            id="address-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Search or enter address"
            aria-label="Search or enter address"
            aria-autocomplete="list"
            aria-controls="suggestions"
          />
          <button id="bookmark" class="icon-btn small" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark">
            <svg viewBox="0 0 16 16"><path d="M8 2l1.8 3.7 4 .6-2.9 2.8.7 4L8 11.2 4.4 13.1l.7-4L2.2 6.3l4-.6z" /></svg>
          </button>
        </div>
      </div>
    </header>

    <div id="backdrop" hidden></div>
    <ul id="suggestions" role="listbox" hidden></ul>

    <script src="chrome.js"></script>
  </body>
</html>
